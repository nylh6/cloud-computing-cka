apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  namespace: cloud-app
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: db-migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL at mysql-service:3306..."
              until nc -z -v -w5 mysql-service 3306; do
                echo "MySQL is unavailable - sleeping 3s..."
                sleep 3
              done
              echo "MySQL is up and running!"
      containers:
        - name: migration
          image: nylh6/cloud-backend:v1
          command:
            - node
            - node_modules/typeorm/cli.js
            - migration:run
            - -d
            - dist/database/data-source.js
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
