apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cloud-app
data:
  PORT: "3000"
  MYSQL_HOST: "mysql-service"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "cloud_db"
  JWT_EXPIRES_IN: "3600"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: cloud-app
type: Opaque
stringData:
  MYSQL_USER: "cloud_user"
  MYSQL_PASSWORD: "CloudPassword2026!"
  MYSQL_ROOT_PASSWORD: "RootPassword2026!"
  JWT_SECRET: "jwt-secret-key-cloud-computing-cka-2026-very-secure-token"
  SEED_PASSWORD: "SeedPassword2026!"
